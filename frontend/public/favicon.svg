<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#0A0A0A"/>
  <!-- Perfume bottle body -->
  <rect x="22" y="28" width="20" height="24" rx="4" fill="url(#gold)"/>
  <!-- Bottle neck -->
  <rect x="27" y="20" width="10" height="10" rx="2" fill="url(#gold)"/>
  <!-- Bottle cap -->
  <rect x="25" y="14" width="14" height="8" rx="3" fill="#E8C96A"/>
  <!-- Spray nozzle -->
  <rect x="38" y="17" width="5" height="3" rx="1.5" fill="#D4AF37"/>
  <!-- Spray particles -->
  <circle cx="46" cy="12" r="1.5" fill="#E8C96A" opacity="0.7"/>
  <circle cx="49" cy="16" r="1" fill="#E8C96A" opacity="0.5"/>
  <circle cx="44" cy="9" r="1" fill="#E8C96A" opacity="0.4"/>
  <!-- Label line -->
  <rect x="26" y="35" width="12" height="1.5" rx="0.75" fill="#0A0A0A" opacity="0.3"/>
  <rect x="26" y="39" width="8" height="1.5" rx="0.75" fill="#0A0A0A" opacity="0.3"/>
  <defs>
    <linearGradient id="gold" x1="22" y1="14" x2="42" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8C96A"/>
      <stop offset="100%" stop-color="#B8962A"/>
    </linearGradient>
  </defs>
</svg>