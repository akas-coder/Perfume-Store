<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark background -->
  <rect width="64" height="64" rx="14" fill="#0A0A0A"/>

  <!-- Perfume bottle body (elegant rounded shape) -->
  <rect x="18" y="30" width="28" height="22" rx="6" fill="url(#bodyGrad)"/>

  <!-- Bottle shoulder -->
  <path d="M22 30 Q18 28 20 24 L24 22 Q28 30 18 30Z" fill="url(#bodyGrad)" opacity="0"/>
  <path d="M20 30 Q20 26 24 24 L40 24 Q44 26 44 30Z" fill="url(#bodyGrad)"/>

  <!-- Bottle neck -->
  <rect x="26" y="18" width="12" height="8" rx="3" fill="url(#neckGrad)"/>

  <!-- Cap -->
  <rect x="23" y="11" width="18" height="9" rx="4" fill="url(#capGrad)"/>

  <!-- Spray nozzle -->
  <rect x="40" y="14" width="6" height="3" rx="1.5" fill="#D4AF37"/>
  <!-- Nozzle tip -->
  <circle cx="47" cy="15.5" r="1.5" fill="#E8C96A"/>

  <!-- Spray mist particles -->
  <circle cx="52" cy="10" r="1.2" fill="#E8C96A" opacity="0.6"/>
  <circle cx="55" cy="14" r="0.9" fill="#E8C96A" opacity="0.45"/>
  <circle cx="53" cy="7" r="0.8" fill="#E8C96A" opacity="0.35"/>
  <circle cx="57" cy="11" r="0.6" fill="#E8C96A" opacity="0.3"/>

  <!-- Bottle label / shine -->
  <rect x="22" y="33" width="20" height="1.5" rx="0.75" fill="#fff" opacity="0.12"/>
  <rect x="22" y="37" width="14" height="1.5" rx="0.75" fill="#fff" opacity="0.08"/>

  <!-- Shine effect on bottle -->
  <rect x="20" y="30" width="4" height="18" rx="2" fill="white" opacity="0.08"/>

  <defs>
    <linearGradient id="bodyGrad" x1="18" y1="24" x2="46" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8C96A"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="neckGrad" x1="26" y1="18" x2="38" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8C96A"/>
      <stop offset="100%" stop-color="#B8962A"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="23" y1="11" x2="41" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0D080"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
  </defs>
</svg>