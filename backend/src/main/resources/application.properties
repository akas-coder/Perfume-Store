# ========================
# PERfume Backend Configuration
# ========================

spring.application.name=perfume-backend

# Server
server.port=8080

# ========================
# Database (MySQL)
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/perfume_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================
# JWT Configuration
# ========================
jwt.secret=PERfume-JWT-Secret-Key-Change-In-Production-2024-SecureRandom
jwt.expiration=604800000
jwt.admin-expiration=86400000

# ========================
# Cloudinary Configuration
# ========================
cloudinary.cloud-name=your_cloud_name
cloudinary.api-key=your_api_key
cloudinary.api-secret=your_api_secret

# ========================
# File Upload
# ========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ========================
# Logging
# ========================
logging.level.com.perfume=DEBUG
logging.level.org.springframework.web=INFO

# ========================
# Springdoc / Swagger
# ========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ========================
# Password Reset
# ========================
app.reset-token.expiration-minutes=30
app.frontend-url=http://localhost:5173
