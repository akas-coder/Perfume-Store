# ========================
# PERfume Backend Configuration
# ========================

spring.application.name=perfume-backend

# Server
server.port=8080

# ========================
# Database (MySQL)
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/perfume_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=username
spring.datasource.password=your password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ========================
# Cloudinary Configuration
# ========================
cloudinary.cloud-name=your_cloud_name
cloudinary.api-key=your_api_key
cloudinary.api-secret=your_api_secret

# ========================
# Session Configuration
# ========================
server.servlet.session.timeout=7d
server.servlet.session.cookie.name=PERFUME_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# ========================
# File Upload
# ========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ========================
# Logging
# ========================
logging.level.com.perfume=DEBUG
logging.level.org.springframework.web=INFO

# ========================
# Springdoc / Swagger
# ========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ========================
# Spring Security (disabled - we use session-based manual auth)
# ========================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
