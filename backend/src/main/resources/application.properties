# ========================
# PERfume Backend Configuration
# ========================

spring.application.name=perfume-backend

# Server
server.port=${PORT:8080}

# ========================
# Database (MySQL)
# ========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/perfume_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ========================
# JWT Configuration
# ========================
jwt.secret=${JWT_SECRET:PERfume-JWT-Secret-Key-Change-In-Production-2024-SecureRandom}
jwt.expiration=604800000
jwt.admin-expiration=86400000

# ========================
# Cloudinary Configuration
# ========================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}

# ========================
# File Upload
# ========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ========================
# Logging
# ========================
logging.level.com.perfume=INFO
logging.level.org.springframework.web=INFO

# ========================
# Springdoc / Swagger
# ========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ========================
# Password Reset & CORS
# ========================
app.reset-token.expiration-minutes=30
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.allowed-origin=${APP_ALLOWED_ORIGIN:http://localhost:5173}
